<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Play The Last Star: Into the Dark</title>
<meta name="description" content="Play the free chapters of The Last Star: Into the Dark in your browser. An atmospheric puzzle platformer by Abdur Studio.">
<link rel="icon" href="icon.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#e9dfc6}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;background:#000;outline:none;max-width:100vw;max-height:100vh}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;transition:opacity .6s}
  #load h1{font-weight:400;letter-spacing:.32em;font-size:clamp(18px,4vw,34px);margin:0 0 6px;color:#f3d98a}
  #load p{letter-spacing:.3em;font-size:clamp(10px,1.6vw,13px);margin:0 0 28px;opacity:.6}
  #bar{width:min(300px,60vw);height:3px;background:#222}
  #bar i{display:block;height:100%;width:0;background:#f3d98a;transition:width .2s}
  #note{margin-top:22px;font-size:12px;opacity:.5;letter-spacing:.08em;text-align:center;padding:0 24px}
  #fs{position:fixed;right:10px;bottom:10px;width:38px;height:38px;border-radius:8px;border:1px solid #ffffff30;background:#00000070;color:#fff;font-size:18px;cursor:pointer;opacity:.45}
  #fs:hover{opacity:1}
  #rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;text-align:center;font-size:18px;letter-spacing:.1em;padding:30px;z-index:5}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
  #err{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center;padding:30px;z-index:6}
  a{color:#f3d98a}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="-1"></canvas></div>
<div id="load"><h1>THE LAST STAR</h1><p>INTO THE DARK</p><div id="bar"><i id="p"></i></div><div id="note">Loading, the first visit takes a moment. Best in landscape with sound on.</div></div>
<button id="fs" title="Fullscreen">&#x26F6;</button>
<div id="rot">Turn your phone sideways to play.</div>
<div id="err"><h2>Couldn't start the game</h2><p>Your browser may not support WebGL 2. Try Chrome, Edge, Firefox or Safari, or get the app:<br><a href="https://maani1pk.github.io/the-last-star/">The Last Star on the App Store</a></p></div>
<script src="Build/WebGL.loader.js"></script>
<script>
  var canvas=document.getElementById('c');
  function fit(){canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';}
  fit();addEventListener('resize',fit);
  createUnityInstance(canvas,{
    dataUrl:"Build/WebGL.data.unityweb",frameworkUrl:"Build/WebGL.framework.js.unityweb",codeUrl:"Build/WebGL.wasm.unityweb",
    streamingAssetsUrl:"StreamingAssets",companyName:"Abdur Studio",productName:"The Last Star",productVersion:"1.0.0",
    devicePixelRatio:Math.min(window.devicePixelRatio||1,2)
  },function(p){document.getElementById('p').style.width=(p*100)+'%';}).then(function(u){
    var l=document.getElementById('load');l.style.opacity=0;setTimeout(function(){l.style.display='none';},700);
    document.getElementById('fs').onclick=function(){u.SetFullscreen(1);};
    canvas.focus();
  }).catch(function(e){console.error(e);document.getElementById('load').style.display='none';document.getElementById('err').style.display='flex';});
</script>
</body>
</html>
