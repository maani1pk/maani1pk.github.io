<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Desk — Abdur Studio</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5F3FA">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<noscript><p style="padding:24px">This page needs JavaScript.</p></noscript>

<main class="login" id="login" hidden>
  <form class="login__card" id="login-form" autocomplete="on">
    <img src="/assets/img/logo.svg" alt="Abdur Studio" width="130" height="44">
    <h1>Client Desk</h1>
    <p class="muted">Administrator sign-in</p>
    <label class="f">Email<input type="email" name="email" autocomplete="username" required></label>
    <label class="f">Password<input type="password" name="password" autocomplete="current-password" required></label>
    <p class="msg" id="login-msg" role="alert"></p>
    <button class="btn btn--primary" type="submit" id="login-btn">Sign in</button>
    <p class="muted small" id="login-setup" hidden>The client database is not connected yet. Add the Supabase URL and public key in <code>assets/js/config.js</code>; the steps are in <code>_src/crm/CRM_SETUP.md</code>.</p>
  </form>
</main>

<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Sections">
    <a class="side__brand" href="/admin/"><img src="/assets/img/logo.svg" alt="Abdur Studio" width="118" height="40"></a>
    <nav id="nav"></nav>
    <div class="side__foot">
      <p class="small muted" id="who"></p>
      <button class="btn btn--ghost btn--sm" type="button" id="logout">Sign out</button>
      <a class="small" href="/">Back to site</a>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn btn--ghost btn--sm menu-btn" type="button" id="menu-btn" aria-controls="side" aria-expanded="false">Menu</button>
      <h1 id="view-title">Dashboard</h1>
      <div class="top__actions">
        <button class="btn btn--ghost btn--sm" type="button" id="btn-new">Add client</button>
        <button class="btn btn--ghost btn--sm" type="button" id="btn-xlsx">Export to Excel (.xlsx)</button>
        <button class="btn btn--ghost btn--sm" type="button" id="btn-json">Backup (.json)</button>
        <button class="btn btn--primary btn--sm" type="button" id="btn-sync">Sync now</button>
      </div>
    </header>
    <p class="banner" id="sync-banner" role="status"></p>
    <p class="banner banner--error" id="load-error" role="alert" hidden></p>
    <section id="view" aria-live="polite"></section>
  </div>
</div>

<div class="drawer-wrap" id="drawer-wrap" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/crm-api.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
